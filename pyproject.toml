[project]
name = "greywind"
version = "0.1.0"
description = "灰风 — 桌面 AI 伴侣"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "openai",
    "anthropic",
    "chardet",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "edge-tts",
    "requests",
    "jinja2",
    "onnxruntime>=1.19.0",
    "pydub>=0.25.1",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.0",
    "pygetwindow>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.58.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greywind"]
